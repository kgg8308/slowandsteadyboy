name: 최신 영상 갱신

# 유튜브 채널 RSS를 읽어 index.html 의 영상 칸을 다시 만들고, 바뀐 게 있으면 커밋합니다.
# 커밋이 push 되면 GitHub Pages 가 자동으로 다시 배포합니다.
# 내 PC가 꺼져 있어도 깃허브에서 알아서 돕니다.

on:
  schedule:
    - cron: '0 */6 * * *' # 6시간마다 (UTC 기준)
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 유튜브 RSS 읽어 영상 칸 채우기
        run: node build.mjs

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "최신 영상 자동 갱신"
            git push
            echo "갱신했습니다."
          else
            echo "바뀐 게 없습니다."
          fi
